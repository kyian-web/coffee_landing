<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Coffee</title>
        <link rel="stylesheet" href="./css/main.min.css" />
    </head>
    <body>
        <header class="header">
            <div class="container">
                <div class="header__wrapper">
                    <nav class="header__nav">
                        <a class="logo" href="/">Bean Scene</a>

                        <ul class="header__menu">
                            <li class="header__link"><a href="#">Home</a></li>
                            <li class="header__link"><a href="#">Menu</a></li>
                            <li class="header__link"><a href="#">About Me</a></li>
                            <li class="header__link"><a href="#">Contact Us</a></li>
                        </ul>

                        <div class="header__auth">
                            <button class="in" href="#">Sing In</button>
                            <button class="up button" href="#">Sing Up</button>
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <section class="hero">
            <div class="container">
                <div class="hero__wrapper">
                    <h1 class="hero__title">
                        We’ve got your morning covered with <span>Coffee</span>
                    </h1>
                    <div class="hero__text">
                        It is best to start your day with a cup of coffee. Discover the best
                        flavours coffee you will ever have. We provide the best for our customers.
                    </div>
                    <button class="hero__button button">Order Now</button>
                </div>
            </div>
        </section>
        <section class="description"></section>
        <section class="catalog"></section>
        <section class="advantages"></section>
        <section class="chance"></section>
        <section class="reviews"></section>
        <section class="subscribe"></section>
        <footer class="footer"></footer>

</html>
